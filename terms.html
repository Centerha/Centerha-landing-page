<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src https://api.centerha.software; form-action 'none'; base-uri 'none'">
  <title>Centerha — Terms of Use</title>
  <link rel="canonical" href="https://web.centerha.software/terms">
  <link rel="stylesheet" href="/assets/css/legal.css">
  <script src="/assets/js/language.js" defer></script>
  <script src="/assets/js/config.js" defer></script>
  <script src="/assets/js/api.js" defer></script>
  <script src="/assets/js/content-page.js" defer></script>
</head>
<body data-content-slug="terms-of-use">
  <main>
    <header>
      <a href="/"><img src="/assets/images/logo-mark.png" alt=""> Centerha</a>
      <div class="languages language-switch" role="group" aria-label="Language" data-i18n-aria-label="languageSelector">
        <button type="button" data-lang="en" lang="en" aria-pressed="true">English</button>
        <button type="button" data-lang="ar" lang="ar" aria-pressed="false">العربية</button>
      </div>
    </header>
    <h1 id="contentTitle"><span data-en>Terms of Use</span><span data-ar>شروط الاستخدام</span></h1>
    <div id="contentError" role="status" hidden>
      <p><span data-en>The latest content could not be loaded.</span><span data-ar>تعذّر تحميل أحدث محتوى.</span></p>
      <button id="contentRetry" type="button"><span data-en>Retry</span><span data-ar>إعادة المحاولة</span></button>
    </div>
    <article>
      <div id="contentBodyEn" lang="en" dir="ltr" data-en></div>
      <div id="contentBodyAr" lang="ar" dir="rtl" data-ar></div>
    </article>
    <nav aria-label="Centerha" data-i18n-aria-label="primaryNavigation">
      <a href="/privacy-policy"><span data-en>Privacy Policy</span><span data-ar>سياسة الخصوصية</span></a>
      <a href="/support"><span data-en>Support</span><span data-ar>الدعم</span></a>
      <a href="/delete-account"><span data-en>Delete account</span><span data-ar>حذف الحساب</span></a>
    </nav>
  </main>
</body>
</html>
